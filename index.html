<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#040d1a" />
  <title>J.A.R.V.I.S. Core</title>
  <style>
    :root {
      --bg-dark: #040d1a;
      --bg-panel: rgba(8, 25, 48, 0.78);
      --cyan: #00e5ff;
      --cyan-soft: rgba(0, 229, 255, 0.22);
      --blue-glow: rgba(0, 140, 255, 0.45);
      --text-main: #e6f7ff;
      --text-dim: #7fb3c8;
      --ok: #2ef29b;
      --warn: #ffbe3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(circle at 50% 25%, rgba(0, 180, 255, 0.16), transparent 55%),
        radial-gradient(circle at 50% 80%, rgba(0, 229, 255, 0.08), transparent 60%),
        var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 18px 14px 22px;
      overflow-x: hidden;
    }

    .topbar {
      width: 100%;
      max-width: 540px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border: 1px solid var(--cyan-soft);
      border-radius: 14px;
      background: var(--bg-panel);
      backdrop-filter: blur(8px);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    .brand {
      font-weight: 700;
      color: var(--cyan);
      text-shadow: 0 0 10px var(--blue-glow);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-dim);
      font-size: 0.78rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
    }

    .dot.listening {
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      animation: pulseDot 0.9s infinite alternate;
    }

    @keyframes pulseDot {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.25); opacity: 1; }
    }

    .core-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 14px 0;
    }

    .core-btn {
      position: relative;
      width: 176px;
      height: 176px;
      border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.45);
      background: radial-gradient(circle, rgba(0, 229, 255, 0.22) 0%, rgba(4, 13, 26, 0.95) 72%);
      box-shadow: 0 0 28px var(--blue-glow), inset 0 0 24px rgba(0, 229, 255, 0.25);
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--text-main);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .core-btn:active {
      transform: scale(0.96);
    }

    .core-btn.active {
      box-shadow: 0 0 42px var(--cyan), inset 0 0 32px rgba(0, 229, 255, 0.45);
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed rgba(0, 229, 255, 0.45);
      pointer-events: none;
    }

    .ring-1 {
      width: 152px;
      height: 152px;
      animation: spinCW 11s linear infinite;
    }

    .ring-2 {
      width: 124px;
      height: 124px;
      border-style: solid;
      border-color: rgba(0, 229, 255, 0.24) var(--cyan) rgba(0, 229, 255, 0.24) transparent;
      animation: spinCCW 5.5s linear infinite;
    }

    .core-btn.active .ring-1 {
      animation-duration: 3.5s;
    }

    .core-btn.active .ring-2 {
      animation-duration: 2s;
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    .core-label {
      position: relative;
      z-index: 2;
      text-align: center;
      pointer-events: none;
    }

    .core-title {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--cyan);
    }

    .core-sub {
      display: block;
      font-size: 0.74rem;
      color: var(--text-dim);
      margin-top: 3px;
    }

    .panel {
      width: 100%;
      max-width: 540px;
      background: var(--bg-panel);
      border: 1px solid var(--cyan-soft);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .io-box {
      background: rgba(2, 10, 20, 0.72);
      border: 1px solid rgba(0, 229, 255, 0.16);
      border-radius: 12px;
      padding: 11px 12px;
      min-height: 54px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .io-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cyan);
      margin-bottom: 3px;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .input-cmd {
      flex: 1;
      background: rgba(2, 10, 20, 0.85);
      border: 1px solid var(--cyan-soft);
      border-radius: 11px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .input-cmd:focus {
      border-color: var(--cyan);
    }

    .btn-action {
      background: rgba(0, 229, 255, 0.16);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      border-radius: 11px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.25);
      color: var(--text-dim);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .chip:hover {
      color: var(--text-main);
      border-color: var(--cyan);
    }

    .footer-note {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">J.A.R.V.I.S. // MK-I</span>
    <span class="status-pill">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">EN LÍNEA</span>
    </span>
  </header>

  <main class="core-stage">
    <button id="micBtn" class="core-btn" type="button" aria-label="Activar micrófono de Jarvis">
      <span class="ring ring-1"></span>
      <span class="ring ring-2"></span>
      <span class="core-label">
        <span id="coreTitle" class="core-title">MICRÓFONO</span>
        <span id="coreSub" class="core-sub">Toca para hablar</span>
      </span>
    </button>
  </main>

  <section class="panel">
    <div class="io-box">
      <span class="io-label">Tú dijiste / escribiste</span>
      <div id="userText">Esperando instrucción...</div>
    </div>

    <div class="io-box">
      <span class="io-label">Respuesta de J.A.R.V.I.S.</span>
      <div id="jarvisText">Sistemas listos. Toca el núcleo o escribe un comando.</div>
    </div>

    <div class="controls">
      <input id="cmdInput" class="input-cmd" type="text" placeholder="Escribe un comando (ej. hora, fecha, estado)..." />
      <button id="sendBtn" class="btn-action" type="button">Enviar</button>
    </div>

    <div class="chips">
      <button class="chip" type="button" data-cmd="hora">Hora</button>
      <button class="chip" type="button" data-cmd="fecha">Fecha</button>
      <button class="chip" type="button" data-cmd="estado">Estado del sistema</button>
      <button class="chip" type="button" data-cmd="ayuda">Comandos</button>
    </div>
  </section>

  <p id="permHint" class="footer-note">
    Tip: Usa HTTPS y concede permiso de micrófono cuando el navegador o la app lo solicite.
  </p>

  <script>
    const micBtn = document.getElementById("micBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const coreTitle = document.getElementById("coreTitle");
    const coreSub = document.getElementById("coreSub");
    const userText = document.getElementById("userText");
    const jarvisText = document.getElementById("jarvisText");
    const cmdInput = document.getElementById("cmdInput");
    const sendBtn = document.getElementById("sendBtn");
    const permHint = document.getElementById("permHint");

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "es-MX";
      utter.rate = 1.03;
      window.speechSynthesis.speak(utter);
    }

    function setListeningUI(active, label = "EN LÍNEA", sub = "Toca para hablar") {
      isListening = active;
      micBtn.classList.toggle("active", active);
      statusDot.classList.toggle("listening", active);
      statusText.textContent = label;
      coreTitle.textContent = active ? "ESCUCHANDO" : "MICRÓFONO";
      coreSub.textContent = sub;
    }

    function processCommand(rawInput) {
      const clean = (rawInput || "").trim();
      if (!clean) return;

      userText.textContent = clean;
      const q = clean.toLowerCase();
      let reply = "";

      if (q.includes("hola") || q.includes("jarvis")) {
        reply = "¡Hola! Núcleo J.A.R.V.I.S. activo y escuchándote.";
      } else if (q.includes("hora")) {
        const now = new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
        reply = `Son las ${now}.`;
      } else if (q.includes("fecha") || q.includes("día") || q.includes("dia")) {
        const today = new Date().toLocaleDateString("es-MX", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
        reply = `Hoy es ${today}.`;
      } else if (q.includes("estado") || q.includes("sistema")) {
        const online = navigator.onLine ? "conectada a red" : "sin conexión";
        reply = `Todos los módulos están operativos y la interfaz está ${online}.`;
      } else if (q.includes("ayuda") || q.includes("comando")) {
        reply = "Puedes pedirme la hora, la fecha, el estado del sistema o saludarme.";
      } else {
        reply = `Recibí: "${clean}". Comando registrado en el núcleo local.`;
      }

      jarvisText.textContent = reply;
      speak(reply);
    }

    async function requestMicPermissionAndStart() {
      if (!SpeechRecognition) {
        setListeningUI(false, "MODO TEXTO", "Voz no soportada aquí");
        permHint.textContent = "Este navegador o WebView no soporta reconocimiento de voz; usa el campo de texto.";
        return;
      }

      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
        }
      } catch (err) {
        setListeningUI(false, "SIN MICRÓFONO", "Permiso denegado");
        permHint.textContent = "Permiso de micrófono bloqueado. Actívalo en ajustes del navegador o de la app.";
        return;
      }

      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "es-MX";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          setListeningUI(true, "ESCUCHANDO", "Habla ahora...");
        };

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          processCommand(transcript);
        };

        recognition.onerror = (event) => {
          setListeningUI(false, "ERROR DE VOZ", "Reintenta tocar");
          permHint.textContent = `Detalle de voz: ${event.error}.`;
        };

        recognition.onend = () => {
          if (isListening) {
            setListeningUI(false, "EN LÍNEA", "Toca para hablar");
          }
        };
      }

      try {
        if (isListening) {
          recognition.stop();
          setListeningUI(false, "EN LÍNEA", "Toca para hablar");
        } else {
          recognition.start();
        }
      } catch (_) {
        setListeningUI(false, "EN LÍNEA", "Toca para hablar");
      }
    }

    micBtn.addEventListener("click", requestMicPermissionAndStart);

    sendBtn.addEventListener("click", () => {
      processCommand(cmdInput.value);
      cmdInput.value = "";
    });

    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        processCommand(cmdInput.value);
        cmdInput.value = "";
      }
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        processCommand(chip.dataset.cmd);
      });
    });

    if ("serviceWorker" in navigator && location.protocol === "https:") {
      const swCode = `
        self.addEventListener("install", (e) => self.skipWaiting());
        self.addEventListener("activate", (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener("fetch", (e) => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: "application/javascript" });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }
  </script>
</body>
</html>
